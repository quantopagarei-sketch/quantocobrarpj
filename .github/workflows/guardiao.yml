name: Guardião do site
on:
  schedule:
    - cron: "41 11 * * *"   # 8h41 em São Paulo
    - cron: "41 17 * * *"   # 14h41
    - cron: "5 23 * * *"    # 20h05 (antes do relatório do Gerente)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Verificar o site
        id: v
        run: node .github/scripts/guardiao.js
        continue-on-error: true
      - name: Guardar resultado (só se mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet HEAD -- seo/saude.json 2>/dev/null || [ "$(python3 -c "import json;print(json.load(open('seo/saude.json'))['status'])")" = "$(git show HEAD:seo/saude.json 2>/dev/null | python3 -c "import sys,json;print(json.load(sys.stdin)['status'])" 2>/dev/null)" ] && [ "$(git log -1 --format=%cd --date=format:%Y%m%d -- seo/saude.json)" = "$(TZ=America/Sao_Paulo date +%Y%m%d)" ]; then echo "sem mudança relevante"; exit 0; fi
          git add seo/saude.json && git commit -m "Guardião: $(python3 -c "import json;print(json.load(open('seo/saude.json'))['status'])") [skip netlify]" && git pull --rebase && git push
      - name: Falhar se houver problema (o GitHub manda e-mail ao dono)
        if: steps.v.outcome == 'failure'
        run: exit 1
