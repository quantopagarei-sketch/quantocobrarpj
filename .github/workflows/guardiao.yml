name: Guardião do site
on:
  schedule:
    - cron: "41 11 * * *"   # 8h41 em São Paulo
    - cron: "41 17 * * *"   # 14h41
    - cron: "5 23 * * *"    # 20h05
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - name: Verificar o site
        id: v
        run: node .github/scripts/guardiao.js
        continue-on-error: true
      - name: Guardar resultado (só se mudou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Grava quando o status muda OU quando é a 1ª verificação do dia (assim a data em seo/saude.json nunca fica velha)
          NOVO=$(python3 -c "import json;d=json.load(open('seo/saude.json'));print(d['status'],d['verificado_em'][:10])")
          VELHO=$(git show HEAD:seo/saude.json 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['status'],d['verificado_em'][:10])" 2>/dev/null || true)
          if [ "$NOVO" = "$VELHO" ]; then echo "sem mudança relevante (mesmo status, mesmo dia)"; exit 0; fi
          git add seo/saude.json && git commit -m "Guardião: $(python3 -c "import json;print(json.load(open('seo/saude.json'))['status'])") [skip netlify]" && git pull --rebase && git push
      - name: Falhar se houver problema (o GitHub manda e-mail ao dono)
        if: steps.v.outcome == 'failure'
        run: exit 1
