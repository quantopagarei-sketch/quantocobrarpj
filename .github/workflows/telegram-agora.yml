name: Telegram Ofertas (rodar agora)
# Roda o robô na hora quando chega oferta nova em fila/ ou quando disparar.txt muda (ramo "telegram").
# O agendamento de hora em hora fica no ramo main (telegram-ofertas.yml). O que roda está em rodar.sh.
on:
  push:
    branches: [telegram]
    paths: ["disparar.txt", "fila/**"]
permissions:
  contents: write
concurrency:
  group: telegram-ofertas
  cancel-in-progress: false
jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: telegram
      - name: Rodar o robô e guardar o estado
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
        run: bash rodar.sh
