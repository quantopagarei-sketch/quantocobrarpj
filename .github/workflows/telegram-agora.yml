name: Telegram Ofertas (rodar agora)
# Roda o robô na hora quando o arquivo disparar.txt muda no ramo "telegram".
# O agendamento de hora em hora continua no ramo main (telegram-ofertas.yml).
on:
  push:
    branches: [telegram]
    paths: ["disparar.txt"]
permissions:
  contents: write
concurrency:
  group: telegram-ofertas
  cancel-in-progress: false
jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: telegram
      - name: Coletar e postar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
        run: |
          python3 coletor_shopee.py || true
          python3 bot.py
      - name: Guardar estado no ramo telegram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -q -m "Estado do robô $(TZ=America/Sao_Paulo date +%d/%m-%Hh) [skip netlify]"
          for i in 1 2 3; do
            git pull -q --rebase origin telegram && git push -q origin HEAD:telegram && exit 0
            sleep 5
          done
          exit 1
