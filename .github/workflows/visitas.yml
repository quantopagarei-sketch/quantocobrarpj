name: Registrar visitas do dia
on:
  schedule:
    - cron: "17 23 * * *"   # 20h17 em Sao Paulo, antes do relatorio do Gerente (20h35)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  registrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler contador e anotar
        run: |
          set -e
          HOJE=$(TZ=America/Sao_Paulo date +%Y%m%d)
          DATA=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          get(){ curl -s --max-time 20 "https://abacus.jasoncameron.dev/get/quantoeupago-br/$1" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value",0))' 2>/dev/null || echo 0; }
          DIA=$(get "v-$HOJE"); TOTAL=$(get visitas-total)
          mkdir -p seo
          [ -f seo/visitas.csv ] || echo "data,visitas_dia,visitas_total" > seo/visitas.csv
          grep -q "^$DATA," seo/visitas.csv && sed -i "/^$DATA,/d" seo/visitas.csv
          echo "$DATA,$DIA,$TOTAL" >> seo/visitas.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo/visitas.csv
          git commit -m "Visitas $DATA: $DIA no dia, $TOTAL no total [skip netlify]" || exit 0
          git push
