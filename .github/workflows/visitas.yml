name: Registrar visitas do dia
on:
  schedule:
    - cron: "17 23 * * *"   # 20h17 em Sao Paulo
  workflow_dispatch:
permissions:
  contents: write
jobs:
  registrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler contador e anotar
        run: |
          set -e
          HOJE=$(TZ=America/Sao_Paulo date +%Y%m%d)
          DATA=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          get(){ curl -s --max-time 20 "https://abacus.jasoncameron.dev/get/quantoeupago-br/$1" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("value",0))' 2>/dev/null || echo 0; }
          DIA=$(get "v-$HOJE"); TOTAL=$(get visitas-total)
          mkdir -p seo
          [ -f seo/visitas.csv ] || echo "data,visitas_dia,visitas_total" > seo/visitas.csv
          grep -q "^$DATA," seo/visitas.csv && sed -i "/^$DATA,/d" seo/visitas.csv
          echo "$DATA,$DIA,$TOTAL" >> seo/visitas.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          KEYS="c-cltpj c-split c-imposto c-super c-mei2027 c-meilimite c-hora c-relmei c-tabela c-outra k-whatsapp k-contador k-guia k-pdf k-produto k-externo f-contador f-guia k-contabti"
          [ -f seo/eventos.csv ] || echo "data,$(echo $KEYS | tr ' ' ',')" > seo/eventos.csv
          LINHA="$DATA"; for k in $KEYS; do LINHA="$LINHA,$(get "$k-$HOJE")"; done
          grep -q "^$DATA," seo/eventos.csv && sed -i "/^$DATA,/d" seo/eventos.csv
          echo "$LINHA" >> seo/eventos.csv
          # Corrige a linha de ONTEM: a leitura é às 20h17, então as visitas e os usos do fim da noite ficavam de fora
          ONTEM=$(TZ=America/Sao_Paulo date -d "yesterday" +%Y%m%d)
          DATAO=$(TZ=America/Sao_Paulo date -d "yesterday" +%Y-%m-%d)
          python3 - "$DATAO" "$ONTEM" <<'PY' || true
          import sys, json, urllib.request
          datao, ontem = sys.argv[1], sys.argv[2]
          def get(k):
              try:
                  return int(json.load(urllib.request.urlopen("https://abacus.jasoncameron.dev/get/quantoeupago-br/" + k, timeout=20)).get("value", 0))
              except Exception:
                  return None
          def corrigir(path, chaves):
              linhas = open(path).read().splitlines()
              nomes = chaves(linhas[0])
              for i, l in enumerate(linhas):
                  if not l.startswith(datao + ","):
                      continue
                  p = l.split(",")
                  for j, k in nomes:
                      v = get(k + ontem)
                      if v is not None and j < len(p) and p[j].isdigit() and v > int(p[j]):
                          p[j] = str(v)   # só aumenta: falha de leitura nunca apaga número
                  linhas[i] = ",".join(p)
              open(path, "w").write("\n".join(linhas) + "\n")
          corrigir("seo/visitas.csv", lambda h: [(1, "v-")])
          corrigir("seo/eventos.csv", lambda h: [(j, k + "-") for j, k in enumerate(h.split(",")) if j > 0])
          PY
          git add seo/visitas.csv seo/eventos.csv
          git commit -m "Visitas $DATA: $DIA no dia, $TOTAL no total [skip netlify]" || exit 0
          git push
