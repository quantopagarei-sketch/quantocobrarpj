name: Telegram Ofertas (robô postador)
# Canal "Black Achadinhos". Código, fila e estado ficam no ramo "telegram" (não mexe no site).
# Este arquivo só agenda (de hora em hora). O que roda está em rodar.sh, no ramo telegram.
on:
  schedule:
    - cron: "7 11-23 * * *"   # 8h07 às 20h07 em São Paulo
    - cron: "7 0,1 * * *"     # 21h07 e 22h07 em São Paulo
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: telegram-ofertas
  cancel-in-progress: false
jobs:
  postar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: telegram
      - name: Rodar o robô e guardar o estado
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
        run: bash rodar.sh
